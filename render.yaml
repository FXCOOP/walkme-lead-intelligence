services:
  - type: web
    name: lead-intelligence-engine
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_RESEARCH_MODEL
        value: gpt-4o-mini
      - key: REFERENCE_NOW
        value: "2026-04-15T12:00:00Z"
      - key: PYTHON_VERSION
        value: "3.12"
